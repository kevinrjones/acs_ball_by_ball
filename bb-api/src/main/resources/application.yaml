ktor:
  deployment:
    port: "${API_PORT:8081}"
  application:
    modules:
      - com.knowledgespike.ballbyball.api.bootstrap.ApiModuleKt.module

database:
  jdbcUrl: "${DB_JDBC_URL:jdbc:mariadb://localhost:3306/acs_ball_by_ball}"
  user: "${DB_USER:acs_ball_by_ball}"
  password: "${DB_PASSWORD:}"
  maximumPoolSize: "${DB_MAX_POOL_SIZE:10}"