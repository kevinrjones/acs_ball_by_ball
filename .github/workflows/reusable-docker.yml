name: Reusable Docker Workflow

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      image-version:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: '.'
      docker-username:
        required: true
        type: string
      registry-org:
        required: false
        type: string
        default: 'knowledgespike'
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      artifact-name:
        required: false
        type: string
      artifact-path:
        required: false
        type: string
    secrets:
      docker-password:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - name: Ensure executable permissions on binaries
        if: ${{ inputs.artifact-name != '' }}
        run: chmod -R +x ${{ inputs.artifact-path }}/bin || true
        shell: bash

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker-username }}
          password: ${{ secrets.docker-password }}
        if: startsWith(github.ref, 'refs/tags/')

      - name: Push Docker Image
        uses: ./.github/workflows/actions/docker-push
        with:
          image-name: ${{ inputs.image-name }}
          image-version: ${{ inputs.image-version }}
          working-directory: ${{ inputs.working-directory }}
          registry-org: ${{ inputs.registry-org }}
          dockerfile: ${{ inputs.dockerfile }}
        if: startsWith(github.ref, 'refs/tags/')
