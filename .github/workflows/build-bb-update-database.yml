name: Build BB-Update-Database

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    paths:
      - 'bb-update-database/**'
      - 'bb-shared/**'
      - '.github/workflows/build-bb-update-database.yml'
      - '.github/workflows/reusable-gradle.yml'
      - '.github/workflows/reusable-docker.yml'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'bb-update-database/**'
      - 'bb-shared/**'
      - '.github/workflows/build-bb-update-database.yml'
    branches: [ "main" ]

jobs:
  gradle:
    uses: ./.github/workflows/reusable-gradle.yml
    with:
      working-directory: '.'
      build-task: ':bb-update-database:check :bb-update-database:installDist'
      upload-artifact-name: 'bb-update-database-dist'
      upload-artifact-path: 'bb-update-database/build/install/bb-update-database'

  docker-publish:
    needs: gradle
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image-name: 'bb-update-database'
      image-version: ${{ github.ref_name }}
      working-directory: '.'
      dockerfile: 'bb-update-database/Dockerfile.ci'
      docker-username: ${{ vars.DOCKER_USERNAME }}
      artifact-name: 'bb-update-database-dist'
      artifact-path: 'bb-update-database/build/install/bb-update-database'
    secrets:
      docker-password: ${{ secrets.DOCKER_PASSWORD }}
