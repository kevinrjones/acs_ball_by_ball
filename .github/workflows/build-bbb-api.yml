name: Build BBB-API

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    paths:
      - 'bbb-api/**'
      - 'bbb-shared/**'
      - '.github/workflows/build-bbb-api.yml'
      - '.github/workflows/reusable-gradle.yml'
      - '.github/workflows/reusable-docker.yml'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'bbb-api/**'
      - 'bbb-shared/**'
      - '.github/workflows/build-bbb-api.yml'
    branches: [ "main" ]

jobs:
  gradle:
    uses: ./.github/workflows/reusable-gradle.yml
    with:
      working-directory: '.'
      build-task: ':bbb-api:check :bbb-api:installDist'
      upload-artifact-name: 'bbb-api-dist'
      upload-artifact-path: 'bbb-api/build/install/bbb-api'
      create-release: true

  docker-publish:
    needs: gradle
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image-name: 'bbb-api'
      image-version: ${{ github.ref_name }}
      working-directory: '.'
      dockerfile: 'bbb-api/Dockerfile.ci'
      docker-username: ${{ vars.DOCKER_USERNAME }}
      artifact-name: 'bbb-api-dist'
      artifact-path: 'bbb-api/build/install/bbb-api'
    secrets:
      docker-password: ${{ secrets.DOCKER_PASSWORD }}
