name: Reusable Gradle Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: '.'
      java-version:
        required: false
        type: string
        default: '21'
      distribution:
        required: false
        type: string
        default: 'temurin'
      build-task:
        required: false
        type: string
        default: 'build'
      upload-artifact-name:
        required: false
        type: string
        default: 'Package'
      upload-artifact-path:
        required: false
        type: string
      release-body:
        required: false
        type: string
      release-files:
        required: false
        type: string
      create-release:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: ./.github/workflows/actions/setup-jdk
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}

      - name: Build with Gradle
        uses: ./.github/workflows/actions/use-gradle
        with:
          task: ${{ inputs.build-task }}
          working-directory: ${{ inputs.working-directory }}

      - name: Upload build artifacts
        if: ${{ inputs.upload-artifact-path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.upload-artifact-name }}
          path: ${{ inputs.upload-artifact-path }}

  release:
    needs: build
    if: ${{ inputs.create-release && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.upload-artifact-name }}
          path: build-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ inputs.release-body }}
          files: ${{ inputs.release-files }}
          tag_name: ${{ github.ref_name }}
