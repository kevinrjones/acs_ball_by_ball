name: Build BB-Web

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    paths:
      - 'bb-web/**'
      - 'bb-shared/**'
      - '.github/workflows/build-bb-web.yml'
      - '.github/workflows/reusable-gradle.yml'
      - '.github/workflows/reusable-docker.yml'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'bb-web/**'
      - 'bb-shared/**'
      - '.github/workflows/build-bb-web.yml'
    branches: [ "main" ]

jobs:
  gradle:
    uses: ./.github/workflows/reusable-gradle.yml
    with:
      working-directory: '.'
      build-task: ':bb-web:check :bb-web:installDist'
      upload-artifact-name: 'bb-web-dist'
      upload-artifact-path: 'bb-web/build/install/bb-web'

  docker-publish:
    needs: gradle
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image-name: 'bb-web'
      image-version: ${{ github.ref_name }}
      working-directory: '.'
      dockerfile: 'bb-web/Dockerfile.ci'
      docker-username: ${{ vars.DOCKER_USERNAME }}
      artifact-name: 'bb-web-dist'
      artifact-path: 'bb-web/build/install/bb-web'
    secrets:
      docker-password: ${{ secrets.DOCKER_PASSWORD }}
