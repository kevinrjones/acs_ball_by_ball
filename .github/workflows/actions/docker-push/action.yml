name: Push Images to Docker Hub
description: "Pushes Docker images to Docker Hub"

inputs:
  image-name:
    description: "The name of the Docker image to push"
    required: true
  image-version:
    description: "The version of the Docker image to push"
    required: true
  working-directory:
    description: "The working directory for the Docker build"
    required: false
    default: "."
  registry-org:
    description: "The registry organization"
    required: false
    default: "knowledgespike"
  dockerfile:
    description: "The name of the Dockerfile to use"
    required: false
    default: "Dockerfile"

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Push Image ${{ inputs.image-name }}:${{ inputs.image-version }}
      run: |
        docker buildx build --pull --push --platform=linux/amd64,linux/arm64 \
          -f ${{ inputs.dockerfile }} \
          -t ${{ inputs.registry-org }}/${{ inputs.image-name }}:latest \
          -t ${{ inputs.registry-org }}/${{ inputs.image-name }}:${{ inputs.image-version }} \
          .
      shell: bash
      working-directory: ${{ inputs.working-directory }}
