ktor:
  deployment:
    port: "${WEB_PORT:9999}"
    host: "${WEB_HOST:localhost}"
  application:
    modules:
      - com.knowledgespike.ballbyball.web.bootstrap.WebModuleKt.module
  development: "${KTOR_DEVELOPMENT:false}"

api:
  baseUrl: "${API_BASE_URL:http://localhost:8081}"

httpClient:
  requestTimeoutMillis: "${HTTP_REQUEST_TIMEOUT_MILLIS:60000}"
  connectTimeoutMillis: "${HTTP_CONNECT_TIMEOUT_MILLIS:30000}"
  socketTimeoutMillis: "${HTTP_SOCKET_TIMEOUT_MILLIS:60000}"

kbff:
  oidc:
    authority: "${OIDC_AUTHORITY}"
    clientId: "${OIDC_CLIENT_ID}"
    clientSecret: "${OIDC_CLIENT_SECRET}"
    scopes:
      - "openid"
      - "profile"
      - "bbb.api"
      - "bbb.api.read"
    redirectUri: "${OIDC_REDIRECT_URI}"
    postLogoutRedirectUri: "${OIDC_POST_LOGOUT_REDIRECT_URI}"
    registrationUrl: "${OIDC_REGISTRATION_URL}"
    sslCertificatePath: "${OIDC_CERT_PATH:}"
  api:
    baseUrl: "${API_BASE_URL:http://localhost:8081}"
  security:
    csrfHeaderName: "X-CSRF"
  proxy:
    endpoints:
      - path: "/api"
        target: "${API_BASE_URL:http://localhost:8081}/api"