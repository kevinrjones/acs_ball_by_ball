ktor:
  deployment:
    port: "${API_PORT:8081}"
    host: "${API_HOST:localhost}"
  application:
    modules:
      - com.knowledgespike.ballbyball.api.bootstrap.ApiModuleKt.module

jwt:
  jwksUrl: "${JWT_JWKS_URL:https://ids.local:8443/.well-known/openid-configuration/jwks}"
  issuer: "${JWT_ISSUER:https://ids.local:8443}"
  realm: "${JWT_REALM:Access to BallByBall API}"
  audience: "${JWT_AUDIENCE:acs-bbb,bbb.api}"
  leewaySeconds: "${JWT_LEEWAY_SECONDS:3}"
  validScopes:
    - "bbb.api"
    - "bbb.api.read"
    - "bbb.api.write"

database:
  jdbcUrl: "${DB_JDBC_URL:jdbc:mariadb://localhost:3306/acs_ball_by_ball}"
  user: "${DB_USER:ballbyball}"
  password: "${DB_PASSWORD:p4ssw0rd}"
  maximumPoolSize: "${DB_MAX_POOL_SIZE:10}"