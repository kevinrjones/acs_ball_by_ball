ktor:
  development: "${KTOR_DEVELOPMENT:false}"
  deployment:
    port: "${API_PORT:8081}"
    host: "${API_HOST:localhost}"
  application:
    modules:
      - com.knowledgespike.ballbyball.api.bootstrap.ApiModuleKt.module

jwt:
  jwksUrl: "${JWT_JWKS_URL}"
  issuer: "${JWT_ISSUER}"
  realm: "${JWT_REALM:Access to BallByBall API}"
  audience: "${JWT_AUDIENCE}"
  leewaySeconds: "${JWT_LEEWAY_SECONDS:3}"
  validScopes:
    - "bbb.api"
    - "bbb.api.read"
    - "bbb.api.write"

database:
  jdbcUrl: "${DB_JDBC_URL}"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  maximumPoolSize: "${DB_MAX_POOL_SIZE:10}"