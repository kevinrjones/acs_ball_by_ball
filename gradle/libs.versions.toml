[versions]
angus-activation = "2.0.3"
angus-email = "2.0.5"
catalog-update-version-version = "1.1.1"
commons-cli-version = "1.11.0"
flyway-version = "13.5.0"
hikari-version = "7.1.0"
jooq-version = "3.21.8"
jsoup-version = "1.23.2"
junit-version = "6.1.3"
kluent-version = "1.73"
