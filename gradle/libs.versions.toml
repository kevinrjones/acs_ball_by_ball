kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover-version" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-version" }
version-update = { id = "io.github.ben-manes.versions", version.ref = "update-version-version" }
