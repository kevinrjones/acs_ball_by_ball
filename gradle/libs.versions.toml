[versions]
angus-email = "2.0.5"
angus-activation = "2.0.3"
catalog-update-version-version = "1.1.0"
commons-cli-version = "1.11.0"
flyway-version = "12.1.0"
hikari-version = "7.0.2"
jsoup-version = "1.22.1"
junit-version = "6.0.3"
kluent-version = "1.73"
kotlin-couroutines-version = "1.10.2"
kotlin-version = "2.3.10"
kotlinx-serialization-version = "1.10.0"
kover-version = "0.9.1"
logback-version = "1.5.32"
pitest-version = "1.19.0"
pitest-kotlin-version = "1.1.3"
pitest-junit5-version = "1.2.1"
maria-db-version = "3.5.7"
postgres-version = "42.7.10"
sq-lite-version = "3.51.2.0"
strikt-version = "0.35.1"
update-version-version = "0.53.0"

[libraries]
angus-activation = { module = "org.eclipse.angus:angus-activation",  version.ref="angus-activation" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus-email" }
commons-cli = { module = "commons-cli:commons-cli", version.ref = "commons-cli-version" }
flyway = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway-version" }
hikari-cp = { module = "com.zaxxer:HikariCP", version.ref = "hikari-version" }
j-unit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-version" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup-version" }
junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-version" }
kluent = { module = "org.amshove.kluent:kluent", version.ref = "kluent-version" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-couroutines-version" }
kotlin-reflect =  {module = "org.jetbrains.kotlin:kotlin-reflect", version.ref="kotlin-version" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-version" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-version" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback-version" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "maria-db-version" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres-version" }
sq-lite = { module = "org.xerial:sqlite-jdbc", version.ref = "sq-lite-version" }
strikt = { module = "io.strikt:strikt-core", version.ref = "strikt-version" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5-version" }

[plugins]
catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "catalog-update-version-version" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway-version" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-version" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-version" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover-version" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-version" }
version-update = { id = "com.github.ben-manes.versions", version.ref = "update-version-version" }
