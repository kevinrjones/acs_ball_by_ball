<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ball by Ball</title>
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
</head>
<body>
<main>
    <h1>Ball by Ball</h1>
    <p>The web application is connected to the Ktor API.</p>
    <button hx-get="/matches" hx-target="#matches" hx-swap="innerHTML">Load recent matches</button>
    <section id="matches" aria-live="polite">No matches loaded.</section>
</main>
</body>
</html>
